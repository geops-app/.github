<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="GeoPS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14B88B"/>
      <stop offset="1" stop-color="#0B7A5C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#053D2E" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Search radius around the pin -->
  <ellipse cx="256" cy="404" rx="196" ry="44" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="8"/>
  <ellipse cx="256" cy="404" rx="122" ry="27" fill="none" stroke="#FFFFFF" stroke-opacity="0.32" stroke-width="8"/>

  <!-- Map pin -->
  <path filter="url(#shadow)" fill="#FFFFFF"
        d="M256 404 C 236 376, 140 292, 140 206 A 116 116 0 1 1 372 206 C 372 292, 276 376, 256 404 Z"/>

  <!-- Discount badge inside the pin -->
  <circle cx="256" cy="206" r="68" fill="#0F9D76"/>
  <circle cx="230" cy="180" r="15" fill="#FFFFFF"/>
  <circle cx="282" cy="232" r="15" fill="#FFFFFF"/>
  <line x1="290" y1="166" x2="222" y2="246" stroke="#FFFFFF" stroke-width="15" stroke-linecap="round"/>
</svg>
